<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Technology Gopalpur</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    
    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #00E5FF 0%, #3b82f6 100%);
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: #fff;
    }
    
    h1 {
      color: #fff;
      font-size: 24px;
      margin-bottom: 8px;
    }
    
    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 30px;
    }
    
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
      position: relative;
      overflow: hidden;
    }
    
    .btn-facebook {
      background: linear-gradient(135deg, #1877F2 0%, #0d5bbf 100%);
      color: #fff;
    }
    
    .btn-facebook:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(24,119,242,0.4);
    }
    
    .btn-whatsapp {
      background: linear-gradient(135deg, #25D366 0%, #1da851 100%);
      color: #fff;
    }
    
    .btn-whatsapp:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(37,211,102,0.4);
    }
    
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }
    
    .btn svg {
      width: 24px;
      height: 24px;
    }
    
    .btn-count {
      background: rgba(255,255,255,0.2);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      min-width: 30px;
    }
    
    .tracker {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    
    .tracker-title {
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .stats {
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    
    .stat {
      text-align: center;
      padding: 15px 20px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      min-width: 80px;
    }
    
    .stat-number {
      font-size: 28px;
      font-weight: bold;
      color: #00E5FF;
      transition: all 0.3s ease;
    }
    
    .stat-number.pulse {
      animation: pulse 0.5s ease;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); color: #fff; }
    }
    
    .stat-label {
      font-size: 11px;
      color: #64748b;
      margin-top: 5px;
    }
    
    .live-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 15px;
      font-size: 11px;
      color: #64748b;
    }
    
    .live-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: blink 1.5s infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(16,185,129,0.95);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
    }
    
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    
    .last-clicked {
      margin-top: 10px;
      font-size: 10px;
      color: #475569;
    }
    
    .view-data-btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: rgba(0,229,255,0.1);
      border: 1px solid rgba(0,229,255,0.3);
      color: #00E5FF;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.3s ease;
    }
    
    .view-data-btn:hover {
      background: rgba(0,229,255,0.2);
    }
    
    .export-btn {
      margin-top: 10px;
      padding: 8px 16px;
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.3);
      color: #10b981;
      border-radius: 8px;
      cursor: pointer;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">AI</div>
    <h1>AI Technology Gopalpur</h1>
    <p class="subtitle">Connect with us on social media</p>
    
    <div class="links">
      <a href="https://www.facebook.com/Aitechnologygopalpur" target="_blank" rel="noopener" class="btn btn-facebook" id="fbBtn" onclick="trackClick('facebook')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Join Facebook Group
        <span class="btn-count" id="fbCountBtn">0</span>
      </a>
      
      <a href="https://chat.whatsapp.com/IfD7JjeLV2u4LIQPMTORl9" target="_blank" rel="noopener" class="btn btn-whatsapp" id="waBtn" onclick="trackClick('whatsapp')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Join WhatsApp Group
        <span class="btn-count" id="waCountBtn">0</span>
      </a>
    </div>
    
    <div class="tracker">
      <div class="tracker-title">📊 Live Click Statistics</div>
      <div class="stats">
        <div class="stat">
          <div class="stat-number" id="fbCount">0</div>
          <div class="stat-label">Facebook</div>
        </div>
        <div class="stat">
          <div class="stat-number" id="waCount">0</div>
          <div class="stat-label">WhatsApp</div>
        </div>
        <div class="stat">
          <div class="stat-number" id="totalCount">0</div>
          <div class="stat-label">Total</div>
        </div>
      </div>
      <div class="live-indicator">
        <div class="live-dot"></div>
        <span>Real-time tracking active</span>
      </div>
      <div class="last-clicked" id="lastClicked">Waiting for first click...</div>
    </div>
    
    <button class="view-data-btn" onclick="showLocalData()">📋 View Click Data</button>
    <button class="export-btn" onclick="exportData()">📥 Export as JSON</button>
  </div>
  
  <div class="toast" id="toast">✓ Click recorded!</div>
  
  <!-- Modal for viewing data -->
  <div id="dataModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:2000;align-items:center;justify-content:center;padding:20px;">
    <div style="background:#1e293b;border-radius:16px;padding:24px;max-width:600px;width:100%;max-height:80vh;overflow-y:auto;border:1px solid rgba(255,255,255,0.1);">
      <h3 style="color:#fff;margin-bottom:15px;">📊 Click Data (Local Storage)</h3>
      <pre id="dataContent" style="color:#94a3b8;font-size:11px;white-space:pre-wrap;word-break:break-all;"></pre>
      <div style="margin-top:15px;display:flex;gap:10px;justify-content:center;">
        <button onclick="copyData()" style="padding:8px 16px;background:#00E5FF;color:#0f172a;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:12px;">Copy</button>
        <button onclick="closeModal()" style="padding:8px 16px;background:#ef4444;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:12px;">Close</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'social_clicks_v4';
    
    function getClicks() {
      const stored = localStorage.getItem(STORAGE_KEY);
      return stored ? JSON.parse(stored) : [];
    }
    
    function saveClick(clickData) {
      const clicks = getClicks();
      clicks.push(clickData);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(clicks));
    }
    
    function getVisitorId() {
      let uid = localStorage.getItem('visitor_id');
      if (!uid) {
        uid = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('visitor_id', uid);
      }
      return uid;
    }
    
    function getBrowser() {
      const ua = navigator.userAgent;
      if (ua.includes('Chrome')) return 'Chrome';
      if (ua.includes('Firefox')) return 'Firefox';
      if (ua.includes('Safari')) return 'Safari';
      if (ua.includes('Edge')) return 'Edge';
      return 'Other';
    }
    
    function getOS() {
      const ua = navigator.userAgent;
      if (ua.includes('Android')) return 'Android';
      if (ua.includes('iPhone') || ua.includes('iPad')) return 'iOS';
      if (ua.includes('Windows')) return 'Windows';
      if (ua.includes('Mac')) return 'macOS';
      return 'Other';
    }
    
    function isMobile() {
      return /Mobile|Android|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }
    
    const visitorId = getVisitorId();
    
    function trackClick(platform) {
      const sessionKey = `clicked_${platform}_${visitorId}`;
      
      if (sessionStorage.getItem(sessionKey)) {
        showToast(`You already clicked ${platform} this session!`);
        return;
      }
      
      sessionStorage.setItem(sessionKey, 'true');
      
      const clickData = {
        id: Date.now(),
        timestamp: new Date().toISOString(),
        visitor_id: visitorId,
        event: 'click',
        platform: platform,
        url: window.location.href,
        referrer: document.referrer || 'direct',
        user_agent: navigator.userAgent.substring(0, 100),
        screen_resolution: `${screen.width}x${screen.height}`,
        language: navigator.language,
        device: isMobile() ? 'Mobile' : 'Desktop',
        browser: getBrowser(),
        os: getOS()
      };
      
      saveClick(clickData);
      updateDisplay();
      showToast(`${platform.charAt(0).toUpperCase() + platform.slice(1)} link opened!`);
    }
    
    function updateDisplay() {
      const clicks = getClicks();
      const fb = clicks.filter(c => c.platform === 'facebook').length;
      const wa = clicks.filter(c => c.platform === 'whatsapp').length;
      const total = clicks.length;
      
      document.getElementById('fbCount').textContent = fb;
      document.getElementById('waCount').textContent = wa;
      document.getElementById('totalCount').textContent = total;
      document.getElementById('fbCountBtn').textContent = fb;
      document.getElementById('waCountBtn').textContent = wa;
      
      if (clicks.length > 0) {
        const last = clicks[clicks.length - 1];
        document.getElementById('lastClicked').textContent = 
          `Last: ${new Date(last.timestamp).toLocaleString()} • ${last.platform}`;
      }
    }
    
    function showLocalData() {
      const clicks = getClicks();
      const content = document.getElementById('dataContent');
      
      if (clicks.length === 0) {
        content.textContent = 'No clicks recorded yet.';
      } else {
        const summary = {
          total_clicks: clicks.length,
          facebook_clicks: clicks.filter(c => c.platform === 'facebook').length,
          whatsapp_clicks: clicks.filter(c => c.platform === 'whatsapp').length,
          unique_visitors: [...new Set(clicks.map(c => c.visitor_id))].length,
          devices: {
            mobile: clicks.filter(c => c.device === 'Mobile').length,
            desktop: clicks.filter(c => c.device === 'Desktop').length
          },
          browsers: {},
          os: {},
          recent_clicks: clicks.slice(-10).map(c => ({
            time: new Date(c.timestamp).toLocaleString(),
            platform: c.platform,
            device: c.device,
            browser: c.browser,
            os: c.os,
            visitor_id: c.visitor_id.substring(0, 15) + '...'
          }))
        };
        
        clicks.forEach(c => {
          summary.browsers[c.browser] = (summary.browsers[c.browser] || 0) + 1;
        });
        
        clicks.forEach(c => {
          summary.os[c.os] = (summary.os[c.os] || 0) + 1;
        });
        
        content.textContent = JSON.stringify(summary, null, 2);
      }
      
      document.getElementById('dataModal').style.display = 'flex';
    }
    
    function closeModal() {
      document.getElementById('dataModal').style.display = 'none';
    }
    
    function copyData() {
      const data = document.getElementById('dataContent').textContent;
      navigator.clipboard.writeText(data).then(() => {
        showToast('Data copied to clipboard!');
      });
    }
    
    function exportData() {
      const clicks = getClicks();
      if (clicks.length === 0) {
        showToast('No data to export');
        return;
      }
      
      const blob = new Blob([JSON.stringify(clicks, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `click_data_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Data exported!');
    }
    
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    
    (function init() {
      if (!sessionStorage.getItem('sid')) {
        sessionStorage.setItem('sid', Math.random().toString(36).substr(2, 9));
      }
      updateDisplay();
    })();
    
    document.getElementById('dataModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
  </script>
</body>
</html>
