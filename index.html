<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Technology Gopalpur</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    
    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #00E5FF 0%, #3b82f6 100%);
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: #fff;
    }
    
    h1 {
      color: #fff;
      font-size: 24px;
      margin-bottom: 8px;
    }
    
    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 30px;
    }
    
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
    }
    
    .btn-facebook {
      background: #1877F2;
      color: #fff;
    }
    
    .btn-facebook:hover {
      background: #166fe5;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(24,119,242,0.3);
    }
    
    .btn-whatsapp {
      background: #25D366;
      color: #fff;
    }
    
    .btn-whatsapp:hover {
      background: #20bd5a;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37,211,102,0.3);
    }
    
    .btn svg {
      width: 24px;
      height: 24px;
    }
    
    .tracker {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 12px;
      color: #64748b;
    }
    
    .stats {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }
    
    .stat {
      text-align: center;
    }
    
    .stat-number {
      font-size: 20px;
      font-weight: bold;
      color: #00E5FF;
    }
    
    .stat-label {
      font-size: 11px;
      color: #64748b;
    }
    
    .success-msg {
      display: none;
      background: rgba(16,185,129,0.2);
      border: 1px solid #10b981;
      color: #10b981;
      padding: 10px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">AI</div>
    <h1>AI Technology Gopalpur</h1>
    <p class="subtitle">Connect with us on social media</p>
    
    <div class="links">
      <a href="https://www.facebook.com/Aitechnologygopalpur" target="_blank" rel="noopener" class="btn btn-facebook" onclick="trackClick('facebook')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Join Facebook Group
      </a>
      
      <a href="https://chat.whatsapp.com/IfD7JjeLV2u4LIQPMTORl9" target="_blank" rel="noopener" class="btn btn-whatsapp" onclick="trackClick('whatsapp')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Join WhatsApp Group
      </a>
    </div>
    
    <div class="success-msg" id="successMsg">Link clicked successfully! Thank you.</div>
    
    <div class="tracker">
      <div class="stats">
        <div class="stat">
          <div class="stat-number" id="fbCount">0</div>
          <div class="stat-label">Facebook</div>
        </div>
        <div class="stat">
          <div class="stat-number" id="waCount">0</div>
          <div class="stat-label">WhatsApp</div>
        </div>
        <div class="stat">
          <div class="stat-number" id="totalCount">0</div>
          <div class="stat-label">Total</div>
        </div>
      </div>
      <p style="margin-top:10px;font-size:11px;color:#475569;">Click tracking enabled • Powered by Formsubmit</p>
    </div>
  </div>

  <script>
    // Track clicks and submit to Formsubmit
    function trackClick(platform) {
      const data = {
        platform: platform,
        timestamp: new Date().toISOString(),
        url: window.location.href,
        userAgent: navigator.userAgent.substring(0, 100)
      };
      
      // Send to Formsubmit
      fetch('https://formsubmit.co/ajax/minjaruli36@gmail.com', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(data)
      }).catch(() => {});
      
      // Show success
      document.getElementById('successMsg').style.display = 'block';
      setTimeout(() => {
        document.getElementById('successMsg').style.display = 'none';
      }, 2000);
    }
    
    // Load stats from localStorage
    function loadStats() {
      const fb = parseInt(localStorage.getItem('fb_clicks') || '0');
      const wa = parseInt(localStorage.getItem('wa_clicks') || '0');
      document.getElementById('fbCount').textContent = fb;
      document.getElementById('waCount').textContent = wa;
      document.getElementById('totalCount').textContent = fb + wa;
    }
    
    // Override trackClick to also update local stats
    const originalTrackClick = trackClick;
    trackClick = function(platform) {
      if (platform === 'facebook') {
        localStorage.setItem('fb_clicks', parseInt(localStorage.getItem('fb_clicks') || '0') + 1);
      } else if (platform === 'whatsapp') {
        localStorage.setItem('wa_clicks', parseInt(localStorage.getItem('wa_clicks') || '0') + 1);
      }
      loadStats();
      originalTrackClick(platform);
    };
    
    loadStats();
  </script>
</body>
</html>
